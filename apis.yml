aid: lygenesis
name: LyGenesis
description: 'LyGenesis is a Pittsburgh-based clinical-stage cell therapy company developing
  allogeneic regenerative therapies that use a patient''s own lymph nodes as bioreactors
  to grow functioning ectopic organs. Its lead program transplants donor hepatocytes into
  upper-abdominal lymph nodes via endoscopic ultrasound to treat end-stage liver disease
  and is in a Phase 2a clinical trial; preclinical proof-of-concept programs target thymus
  (aging), kidney (end-stage renal disease) and pancreas (Type 1 diabetes). LyGenesis is a
  laboratory and clinical-research organization, not a software vendor: it publishes no
  developer portal, no API documentation and no machine-readable API contract, and this
  profile records that absence rather than any API surface.'
